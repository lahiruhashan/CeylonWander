version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ceylonwander-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceylonwander
      POSTGRES_USER: ceylonwander
      POSTGRES_PASSWORD: ceylonwander_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceylonwander -d ceylonwander"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
