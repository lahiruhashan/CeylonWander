[project]
name = "ceylonwander-api"
version = "1.0.0"
description = "FastAPI backend for CeylonWander running on Cloudflare Workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

